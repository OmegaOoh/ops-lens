[keybinds]
quit = "q"
edit = "e"
scroll_up = "k"
scroll_down = "j"

[log_level]
enabled = true
indicator_position = "top"
show_level_counts = true

[log_level.levels.error]
patterns = [
    "ERROR",
    "SEV",
    "CRITICAL",
]
color = "red"
display_name = "ERROR "

[log_level.levels.warning]
patterns = [
    "WARN",
    "WARNING",
]
color = "yellow"
display_name = "WARN  "

[log_level.levels.info]
patterns = ["INFO"]
color = "green"
display_name = "INFO  "

[log_level.levels.debug]
patterns = [
    "DEBUG",
    "TRACE",
]
color = "blue"
display_name = "DEBUG "
